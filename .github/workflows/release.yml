name: Release Builds

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 0.1.${{ github.run_number }}
      APP_CHANNEL: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Linux artifact
        shell: bash
        run: ./build_linux.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            HojaSQLStudio-linux-portable.zip
            hojasql-studio_${{ env.APP_VERSION }}_amd64.deb

  build-windows:
    runs-on: windows-latest
    env:
      APP_VERSION: 0.1.${{ github.run_number }}
      APP_CHANNEL: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Build Windows artifact
        shell: cmd
        run: build_windows.bat

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            HojaSQLStudio-windows-portable.zip
            dist/HojaSQLStudio-setup.exe

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    env:
      APP_VERSION: 0.1.${{ github.run_number }}
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: HojaSQL Studio v${{ env.APP_VERSION }}
          files: |
            HojaSQLStudio-linux-portable.zip
            hojasql-studio_${{ env.APP_VERSION }}_amd64.deb
            HojaSQLStudio-windows-portable.zip
            HojaSQLStudio-setup.exe
          generate_release_notes: true
